<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">Sparkle architecture</title>
  <desc id="desc">Customers and washers use a browser. The browser connects over HTTPS to the Next.js application on Vercel. The app uses Prisma to access PostgreSQL on Neon.</desc>
  <rect width="720" height="270" rx="10" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
      <rect x="24" y="58" width="170" height="160" rx="8"/>
      <rect x="258" y="32" width="204" height="212" rx="8"/>
      <rect x="526" y="58" width="170" height="160" rx="8"/>
    </g>
    <g font-size="22" font-weight="700">
      <text x="42" y="98">Browser</text>
      <text x="276" y="73">Next.js</text>
      <text x="544" y="98">Neon</text>
    </g>
    <g font-size="18" fill="#334155">
      <text x="42" y="136">Customers</text>
      <text x="42" y="164">Washers</text>
      <text x="276" y="101">Hosted on Vercel</text>
      <text x="276" y="143">Auth.js sign-in</text>
      <text x="276" y="171">Actions + API</text>
      <text x="276" y="213">Prisma</text>
      <text x="544" y="136">PostgreSQL</text>
      <text x="544" y="164">App data</text>
    </g>
    <g stroke="#0891b2" stroke-width="2" fill="none">
      <path d="M204 150h44m-6-5 6 5-6 5m-38-5 6-5m-6 5 6 5M472 150h44m-6-5 6 5-6 5m-38-5 6-5m-6 5 6 5"/>
    </g>
    <g font-size="13" fill="#334155" text-anchor="middle">
      <text x="226" y="134">HTTPS</text>
      <text x="494" y="134">SQL/TLS</text>
    </g>
  </g>
</svg>
